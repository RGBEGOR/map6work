<main id="viewport" aria-label="Рабочая карта">

<div class="top-left"><button class="pill stage-button" id="stepMenu" aria-label="Выбрать этап"></button><span class="context-tag" id="contextTag"></span></div>
<div class="top-right"><button class="pill score-button" id="scoreBtn" title="Сертификат и очки"><span data-icon="award"></span><b id="score">0</b><span class="score-unit">очков</span></button><button class="pill square" id="menuBtn" aria-label="Меню">⋯</button></div>

  <span class="tool-sep"></span>
  <button class="tool" id="zoomIn" title="Увеличить" aria-label="Увеличить" data-icon="plus"></button>
  <button class="tool" id="zoomOut" title="Уменьшить" aria-label="Уменьшить" data-icon="minus"></button>
  <button class="tool" id="fitBtn" title="Карта целиком" aria-label="Карта целиком" data-icon="fit"></button>

function riverLabels(){return RIVERS.filter(r=>stage===3||['nile','nubia'].includes(r.id)).map(r=>`<text x="${r.label[0]}" y="${r.label[1]}" class="river-label" transform="rotate(${r.angle} ${r.label.join(' ')})">${r.name}</text>`).join('')}
function countryMarkup(){const shapes=COUNTRIES.map(c=>`<path class="country-shape country-target" data-country="${c.id}" d="${c.shape}"/>`).join('');return shapes+COUNTRIES.map((c,i)=>{const done=state().flags[c.id]||showAll;return `<g class="country-target" data-country="${c.id}" tabindex="0" role="button" aria-label="${done?c.name:'Страна '+(i+1)}" transform="translate(${c.p.join(' ')})"><g class="flag-marker">${done?`<rect x="-29" y="-23" width="58" height="39" rx="5" fill="white"/><image href="${c.flag}" x="-25" y="-20" width="50" height="33" preserveAspectRatio="xMidYMid meet"/><text y="37" class="country-label">${c.name}</text>`:`<circle r="22" fill="#ffffffed" stroke="#ac91c2" stroke-width="2" stroke-dasharray="3 4"/><text text-anchor="middle" y="5" fill="#806298" font-size="15" font-weight="700">${i+1}</text>`}</g></g>`}).join('')}
function tradeMarkup(){const r=activeRef(),done=state().trades[r.id];return `<path d="${line(r.points)}" class="guide-line trade-guide active-guide" style="stroke:${r.color}" marker-end="url(#arrow-${r.id})"/>`+(done||showAll?strokeMarkup([r.points],r.color,3):'')+strokeMarkup(state().traces['trade:'+r.id],r.color,2.5)+`<text x="${r.label[0]}" y="${r.label[1]}" text-anchor="middle" fill="${r.color}" class="trade-label" font-weight="700" paint-order="stroke" stroke="#fffaf0" stroke-width="4">${r.name} ${r.arrow}</text>`}

 for(const r of PAINTS.filter(p=>p.group===paintGroup&&(paintGroup!=='polities'||p.id===paintId))){const active=r.id===paintId,done=state().paint[r.id];s+=`<path d="${r.shape}" fill="url(#digTexture)" opacity=".8"/>`;

 }
 s+=(p.annotations[era]||[]).map(v=>strokeMarkup([v.pts],v.color,v.width)).join('');
 map.innerHTML=DEFS+`<g id="mapContent" clip-path="url(#mapFrame)">${s}</g><g id="animationLayer" pointer-events="none"></g><g id="liveLayer" clip-path="url(#mapFrame)" pointer-events="none"></g>`;applyView();bindMap();

function showHelp(){openDialog('Карта — главное',`<div class="prose"><p>Выберите этап кнопкой слева сверху. Все 9 этапов открыты. «Пропустить» сохраняет сделанное и переводит дальше; вернуться можно в любой момент.</p><p><b>Карточки:</b> коснитесь детали, названия или флага, затем нужного места. На компьютере работает и перетаскивание.</p><p><b>Линии:</b> проведите по пунктиру и нажмите «Проверить». Можно отпустить палец и продолжить. Нужны 84% пути и 72% точности. Образец показывает направление, но не даёт очков.</p><p><b>Кисть:</b> выберите владение, ном или современную страну, закрасьте 72% площади и проверьте. Кисть не выходит за выбранный контур. Результат считается по видимой в рамке части страны.</p><p><b>На смартфоне:</b> один палец рисует, два пальца перемещают и увеличивают карту. Рука перемещает одним пальцем. «+» приближает, кнопка с рамкой возвращает всю карту. Нажмите заголовок задания, чтобы свернуть панель.</p><p><b>Очки:</b> каждый этап даёт до 100 очков, всего 900. За частичное выполнение начисляется соответствующая доля. Ошибки и подсказки не отнимают очки; повтор уже зачтённого действия не увеличивает счёт.</p><p><b>Сертификат:</b> появляется после завершения этапа. Нажмите на очки, чтобы открыть его раньше, вписать имя и скачать PDF или PNG. В нём видны выполненные и пропущенные этапы. Прогресс для продолжения хранится только в этом браузере.</p><p><b>Учитель:</b> меню → «Учитель» → «Показать образец». Доступны анимация линий, готовые подписи, флаги и свободное перо. Очки ученика сохраняются отдельно. Горячие клавиши: V — задание, H — рука, P — перо, Ctrl/Cmd+Z — отмена.</p></div>`,'Краткая памятка')}
function showSources(){openDialog('История и условности',`<div class="prose"><p><b>Древний Египет · 6 класс.</b> От объединения страны около 3100 года до н. э. до Амарнской эпохи XIV века до н. э., в пределах XVIII династии.</p><h3>Как читать карту</h3><ul><li>Это учебная схема на географической основе. Пунктир обозначает приблизительные владения, а не точные государственные границы. В пустынях и на периферии власть не имела современных линейных рубежей. Не все местные правители показаны.</li><li>Верхний Египет — южная долина Нила; Нижний — северная дельта. Нубия лежит южнее первого порога. Ливийские земли и Ханаан — области с разными народами и политическими центрами, а не единые неизменные страны.</li><li>Для Среднего царства показано продвижение до района Семны у второго порога. Для Нового царства — египетская власть в Нубии до района четвёртого порога. Это обобщение, не одинаковая ситуация во все годы династии.</li><li>Гиксосские цари XV династии правили из Авариса в северной части Египта; фиванские цари сохраняли власть на юге. Между ними были местные владения. Ахмос изгнал гиксосов; точный год завершения объединения обсуждается.</li><li>Штриховка в Леванте — зависимые города и земли. Поход Тутмоса III к Евфрату не означает присоединение всей Сирии и Месопотамии. Битва при Мегиддо условно датирована около 1457 года до н. э.; в литературе встречаются другие хронологии.</li><li>Пути — общие направления военных походов, торговли и экспедиций. Это не точные древние дороги. Пунт показан направлением к южной части Красного моря; его точное положение не установлено окончательно.</li><li>Ном — привычное греческое название египетской области (египетское «сепат»). Показаны восемь выбранных примеров. Позднейший классический список насчитывает 22 нома Верхнего и 20 номов Нижнего Египта; он не означает неизменную систему из 42 областей во все ранние эпохи. Учебные контуры вокруг центров условны.</li><li>Нил и береговые линии обобщены. Два рукава в задании не изображают все древние протоки дельты. Современных Суэцкого канала и озера Насер на древней карте нет. Пороги обозначены цифрами 1–4.</li><li>В задании «Центры» собраны места разных эпох. Ахетатон появляется в слое XIV века до н. э.; его нет на более ранних политических картах. Гиза — центр пирамид, а не столица. Значки Гизы и Мемфиса немного разнесены для удобства на телефоне; тонкие линии ведут к их географическим точкам.</li><li>Флаги и границы современных стран вынесены в отдельный сравнительный режим. Они не приписываются древним государствам. Современные контуры обобщены по Natural Earth; спорные и очень малые участки не детализируются. Кипр показан как один островной учебный объект.</li></ul><h3>Источники</h3><ul class="source-list"><li><a href="https://egymonuments.gov.eg/historical-periods/early-dynastic-period/" target="_blank" rel="noopener">Министерство туризма и древностей Египта: Раннединастический период</a> — объединение страны.</li><li><a href="https://egymonuments.gov.eg/historical-periods/middle-kingdom/" target="_blank" rel="noopener">Среднее царство</a> и <a href="https://www.ucl.ac.uk/museums-static/digitalegypt/nubia/mk.html" target="_blank" rel="noopener">UCL: Нубия в Среднем царстве</a> — южные крепости.</li><li><a href="https://www.ucl.ac.uk/museums-static/digitalegypt/2inter/index.html" target="_blank" rel="noopener">UCL: Второй переходный период</a>, <a href="https://www.ucl.ac.uk/museums-static/digitalegypt/chronology/ahmose.html" target="_blank" rel="noopener">Ахмос</a> — гиксосы, Аварис и восстановление единства.</li><li><a href="https://www.metmuseum.org/zh/toah/ht/03/afe.html" target="_blank" rel="noopener">Metropolitan Museum: Египет, 2000–1000 до н. э.</a> и <a href="https://82nd-and-fifth.metmuseum.org/toah/ht/03/afs.html" target="_blank" rel="noopener">Судан, 2000–1000 до н. э.</a> — XVIII династия, Керма и Нубия.</li><li><a href="https://www.ucl.ac.uk/museums-static/digitalegypt/chronology/thutmosisiii.html" target="_blank" rel="noopener">UCL: Тутмос III</a>, <a href="https://nmec.gov.eg/mummies-hall/Thutmose-iii/" target="_blank" rel="noopener">Национальный музей египетской цивилизации: Тутмос III</a> — походы и пределы влияния.</li><li><a href="https://museum.imj.org.il/en/exhibitions/2016/pharaoh-in-canaan/page/showcomponent?cf=text&imgid=4-1" target="_blank" rel="noopener">Музей Израиля: Pharaoh in Canaan</a> — Мегиддо и египетское влияние в Ханаане.</li><li><a href="https://egymonuments.gov.eg/monuments/hatshepsut-temple/" target="_blank" rel="noopener">Храм Хатшепсут</a> и <a href="https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" target="_blank" rel="noopener">Польско-египетская экспедиция: портик Пунта</a> — торговая экспедиция.</li><li><a href="https://www.britishmuseum.org/collection/term/x116119" target="_blank" rel="noopener">British Museum: Мемфисский ном</a>, <a href="https://www.britishmuseum.org/collection/term/x116118" target="_blank" rel="noopener">Гелиопольский ном</a>, <a href="https://www.britishmuseum.org/collection/term/x51761" target="_blank" rel="noopener">Тинисский ном</a> — номера, центры и изменчивость границ.</li><li><a href="https://elephantine.smb.museum/places/" target="_blank" rel="noopener">Государственные музеи Берлина: Texts &amp; Scripts from Elephantine</a> — Элефантина, Фивы, Ху, Ахмим и другие центры номов.</li><li><a href="https://www.globalegyptianmuseum.org/glossary.aspx?id=271" target="_blank" rel="noopener">Global Egyptian Museum: номы</a>, <a href="https://www.globalegyptianmuseum.org/glossary.aspx?id=183" target="_blank" rel="noopener">Гермополь</a> — выбранные примеры областей.</li><li><a href="https://www.metmuseum.org/ja/toah/ht/03/wam" target="_blank" rel="noopener">Metropolitan Museum: Месопотамия, 2000–1000 до н. э.</a> — Митанни и Вавилония.</li><li>Картографическая основа: <a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener">Natural Earth 1:110m, public domain</a>. Флаги: <a href="https://github.com/lipis/flag-icons" target="_blank" rel="noopener">flag-icons, MIT</a>.</li></ul><p class="micro">Все задания, карта и логотип встроены в index.html. Интернет нужен только для ссылок. Сертификат фиксирует учебный результат, а не защищённую экзаменационную оценку.</p></div>`,'Методическая справка · 6 класс')}
